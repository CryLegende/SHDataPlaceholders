name: SHDataPlaceholders
version: '${project.version}'
main: org.Cry_Legende.sHDataPlaceholders.SHDataPlaceholders
api-version: '1.20'
author: Cry_Legende
depend: [PlaceholderAPI]
# SHNetwork est facultatif : sans lui, les valeurs restent locales (userdata/<uuid>.json) comme avant.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (valeurs en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shdataplaceholders:
    description: Gérer les valeurs par joueur exposées en placeholders
    aliases: [shdata, statsdata]
    usage: /shdataplaceholders <add|take|set|reload|import|info>

permissions:
  shdataplaceholders.admin:
    description: Toute l'administration de SHDataPlaceholders
    default: op
    children:
      shdataplaceholders.admin.add: true
      shdataplaceholders.admin.take: true
      shdataplaceholders.admin.set: true
      shdataplaceholders.admin.reload: true
      shdataplaceholders.admin.import: true
      shdataplaceholders.admin.info: true
  shdataplaceholders.admin.add:
    description: Augmenter une valeur d'un joueur
    default: op
  shdataplaceholders.admin.take:
    description: Réduire une valeur d'un joueur (aussi « remove »)
    default: op
  shdataplaceholders.admin.set:
    description: Fixer une valeur d'un joueur
    default: op
  shdataplaceholders.admin.reload:
    description: Recharger config.yml et messages.yml
    default: op
  shdataplaceholders.admin.import:
    description: Reprendre les fichiers userdata dans la base partagée (mode réseau)
    default: op
  shdataplaceholders.admin.info:
    description: Consulter les valeurs d'un joueur
    default: op
