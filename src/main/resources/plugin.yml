name: SHDataPlaceholders
version: '${project.version}'
main: org.Cry_Legende.sHDataPlaceholders.SHDataPlaceholders
api-version: '1.20'
author: Cry_Legende
depend: [PlaceholderAPI]
# SHNetwork est facultatif : sans lui, les valeurs restent locales (userdata/<uuid>.json) comme avant.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (valeurs en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shdataplaceholders:
    description: Commande principale pour gérer les stats
    aliases: [shdata, statsdata]
    usage: /shdata <add|set|remove> <key> <amount> <player> | import
    permission: shdata.admin

permissions:
  shdata.admin:
    description: Permet de modifier les données
    default: op
