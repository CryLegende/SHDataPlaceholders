# ======================================================================== #
# SHDataPlaceholders
#
# Plugin : valeurs numériques par joueur (add, take, set) exposées en placeholders PlaceholderAPI. Une valeur
# jamais modifiée vaut 'default-value'. Avec SHNetwork, les valeurs sont partagées entre les serveurs (voir la
# section 'reseau' en bas du fichier).
#
# Placeholder : %shdataplaceholders_<clé>% (clé en minuscules).
#
# Commande (alias : /shdata, /statsdata) :
#   /shdataplaceholders add <clé> <montant> <joueur>    Augmente la valeur d'un joueur.
#   /shdataplaceholders take <clé> <montant> <joueur>   Réduit la valeur d'un joueur (ancien nom : remove).
#   /shdataplaceholders set <clé> <montant> <joueur>    Fixe la valeur d'un joueur.
#   /shdataplaceholders info <joueur> [clé]             Affiche une valeur ou toutes les valeurs d'un joueur.
#   /shdataplaceholders reload                          Relit ce fichier et messages.yml, relance la sauvegarde
#                                                       automatique. Un fichier illisible ne change rien. Les clés de
#                                                       'reseau' demandent un redémarrage.
#   /shdataplaceholders import                          Mode réseau : reprend les fichiers userdata dans la base
#                                                       partagée (une seule fois).
#
# Permissions (par défaut : op) :
#   shdataplaceholders.admin          Toutes les sous-commandes.
#   shdataplaceholders.admin.add      /shdataplaceholders add
#   shdataplaceholders.admin.take     /shdataplaceholders take (et remove)
#   shdataplaceholders.admin.set      /shdataplaceholders set
#   shdataplaceholders.admin.info     /shdataplaceholders info
#   shdataplaceholders.admin.reload   /shdataplaceholders reload
#   shdataplaceholders.admin.import   /shdataplaceholders import
#
# Les textes sont dans messages.yml.
#
# ======================================================================== #

# Valeur retournée par le placeholder si aucune donnée n'existe pour cette clé
default-value: 0

# Sauvegarde automatique des joueurs en ligne (en secondes)
# Mettre à -1 pour désactiver (sauvegarde uniquement à la déconnexion/arrêt)
autosave-interval: 300

# Mode réseau. Actif seulement si SHNetwork est installé et 'actif' vaut true : les valeurs sont alors dans la base
# partagée (table shdataplaceholders_values : uuid, stat, value). Chaque add, take ou set est fait par la base,
# pour un joueur de ce serveur, d'un autre serveur ou hors ligne ; les valeurs d'un joueur sont relues à son
# arrivée sur un serveur, et les placeholders lisent la mémoire. Sans SHNetwork, rien de ceci n'est utilisé et les
# valeurs restent dans userdata/<uuid>.json. Demande un redémarrage.
reseau:
  actif: true
  # Durée maximale, en secondes, pendant laquelle on attend que l'autre serveur ait fini de sauvegarder
  # le joueur avant de relire ses valeurs
  attente-max-secondes: 10
  # Sujet du bus sur lequel un serveur prévient les autres qu'une valeur a changé
  canal: shdataplaceholders
  # Table des comptes connus du réseau (colonnes name en minuscules et display_name), pour retrouver par son pseudo
  # un joueur hors ligne qui n'est jamais venu sur ce serveur. Vide : seuls les joueurs connectés sur le réseau
  # ou déjà venus sur ce serveur sont retrouvés.
  table-comptes: "minecraft.comptes"
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/minecraft"
    utilisateur: shdataplaceholders
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes. Une base qui ne répond pas laisse
    # les placeholders sur la valeur par défaut et fait refuser les commandes avec un message d'erreur.
    delai-ms: 3000
