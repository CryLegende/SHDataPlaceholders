# Messages de SHDataPlaceholders. Couleurs avec &. Un message vide ("") n'est pas envoyé.
#
# Variables :
#   %subcommands%  sous-commandes que l'expéditeur peut utiliser, séparées par |
#   %key% %player% %amount% %value% %count%   clé, joueur, montant, nouvelle valeur, nombre de valeurs
#   %file% %error%                            fichier illisible et première ligne de son erreur
#   %joueurs% %ajoutees% %deja%               import (mode réseau)
#   %erreur%                                  erreur de la base (mode réseau)

no-permission: "&7&l« &f&lSH &8&l» &fCommande inconnue, essayez autre chose."
usage: "&7&l« &6&lSH &8&l» &7Utilisation : &6/shdataplaceholders <%subcommands%>"
usage-modify: "&7&l« &6&lSH &8&l» &cUsage: /shdataplaceholders <add|take|set> <clé> <montant> <joueur>"
usage-info: "&7&l« &6&lSH &8&l» &7Utilisation : &6/shdataplaceholders info <joueur> [clé]"
player-not-found: "&7&l« &f&lSH &8&l» &cJoueur introuvable."
invalid-number: "&7&l« &f&lSH &8&l» &cCe n'est pas un nombre valide."
